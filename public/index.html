<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowTheFeed - Bypassing Social Media Login Walls</title>
    <style>
        :root { --brand: #dc2626; --dark: #0f172a; }
        body { font-family: -apple-system, sans-serif; background: #f8fafc; color: var(--dark); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; margin: 0; letter-spacing: -0.04em; line-height: 1; }
        .accent { color: var(--brand); }
        p { font-size: 1.1rem; color: #64748b; margin: 1.5rem 0 2rem; max-width: 550px; line-height: 1.5; }
        .input-group { display: flex; gap: 0.5rem; background: white; padding: 0.6rem; border-radius: 16px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; width: 100%; max-width: 450px; }
        input { flex: 1; border: none; padding: 0.8rem 1.2rem; font-size: 1.1rem; outline: none; border-radius: 12px; }
        button { background: var(--dark); color: white; border: none; padding: 0 1.5rem; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--brand); }
        .footer { padding: 3rem 2rem; font-size: 0.85rem; color: #94a3b8; text-align: center; border-top: 1px solid #f1f5f9; }
        code { background: #e2e8f0; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-weight: bold; color: var(--dark); }
        a { color: #94a3b8; text-decoration: underline; }
        a:hover { color: var(--brand); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>SHOW THE <span class="accent">FEED.</span></h1>
        <p>
            Enter a username to see their newest posts from the <strong>last 24 hours</strong>.<br/>
            We use Google's search index to bypass social media login walls—no account required.
        </p>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Enter X username..." onkeypress="if(event.key === 'Enter') redirect()">
            <button onclick="redirect()">GO</button>
        </div>
        <div style="margin-top: 2rem; font-size: 0.9rem; color: #94a3b8;">
            Quick link: <code>showthefeed.com/username</code>
        </div>
    </div>

    <footer class="footer">
        Built by Munim Kazia &bull; 
        <a href="https://openpublicinfo.ie">OpenPublicInfo.ie</a> &bull; 
        &copy; 2026 ShowTheFeed.com
    </footer>

    <script>
        function redirect() {
            let user = document.getElementById('username').value.trim();
            if (!user) return;
            user = user.replace('@', '').split('/')[0]; 
            window.location.href = '/' + user;
        }
    </script>
</body>
</html>
