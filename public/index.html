<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowTheFeed - Bypassing the Social Media Gate</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1.25rem;
            color: #64748b;
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            background: white;
            padding: 0.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border: 1px solid #e2e8f0;
        }
        input {
            flex: 1;
            border: none;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            outline: none;
        }
        button {
            background-color: #0f172a;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #334155;
        }
        .footer {
            margin-top: 4rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }
        code {
            background: #e2e8f0;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ShowTheFeed</h1>
        <p>Bypass the social media login wall. Just add the username to the URL.</p>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="e.g. irishrail" onkeypress="if(event.key === 'Enter') redirect()">
            <button onclick="redirect()">Show Feed</button>
        </div>

        <div class="footer">
            Or type directly: <code>showthefeed.com/username</code>
        </div>
    </div>

    <script>
        function redirect() {
            const user = document.getElementById('username').value.trim();
            if (user) {
                window.location.href = '/' + user;
            }
        }
    </script>
</body>
</html>
